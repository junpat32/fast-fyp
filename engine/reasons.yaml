# Forecast reasons in plain words (T-11, D-92). DRAFT wording by Claude; Patrick edits freely.
# Review notes: docs/advice_wording_review.md.
#
# A reason is one feature's SHAP contribution (engine/forecast.py). Its words depend on which side
# of the training average the user is on: "high" (above average) or "low" (below average). The app
# shows them under "What raises your risk" or "What keeps your risk low" (invariant P5), so the
# words describe the user's situation and never repeat raises/lowers.
# Yes/no features only ever appear when the answer is yes (P4), so they need only "high".
# "expected": the direction common sense expects when the feature is high (raises / lowers the
# risk). Where the model's coefficient points the other way (overlap between related features),
# engine/forecast.py can leave the reason out: thresholds.json "explanations" (decision W1).
# Demographics (age, type of work) and band indicators are never reasons (P4), so they are not here.

inc_median3:
  expected: lowers
  high: "Your typical monthly income is higher than average"
  low: "Your typical monthly income is lower than average"
inc_cv3:
